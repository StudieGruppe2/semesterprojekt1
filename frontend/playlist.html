<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>playlist</title>
    <link rel="stylesheet" href="playlist.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Proza+Libre:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <h1 class="h1">You're in the queue</h1>

    <!--Playlist box-->
    <main class="main-content">
      <div class="container">
        <div class="box1">
          <div class="row header-row">
            <span>TITLE</span>
            <span>ARTIST</span>
            <span>TIME</span>
            <span>LIKES</span>
            <span>TAKE A VOTE</span>
          </div>
        </div>
      </div>
    </main>
    <!--Bottom area med en durationbar og en leave knap-->
    <div class="bottom-area">
      <div class="player">
        <div class="album-cover"></div>
        <div class="player-bar">
          <span class="time">00:00</span>
          <div class="progress-bar">
            <div class="progress"></div>
          </div>
        </div>
      </div>
      <a href="index.html">
        <button class="leavebtn">Leave party →</button>
      </a>
    </div>
    <script src="script-playlist.js" type="module"></script>
  </body>
</html>
