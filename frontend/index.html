<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>playr</title>
    <link rel="stylesheet" href="forsides.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Proza+Libre:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div>
      <img class="logo" src="logo.png" alt="Playr logo" />
    </div>

    <div class="container">
      <div class="box1">
        <h2 class="h2">Create a party</h2>
        <p class="p">Start a new session and invite others</p>
        <div>
          <button id="Dinner" class="mood-btn">Dinner ➔</button>
          <button id="Party" class="mood-btn">Party ➔</button>
          <button id="Workout" class="mood-btn">Workout ➔</button>
          <button id="Chill" class="mood-btn">Chill ➔</button>
        </div>
      </div>

      <div class="box2">
        <h2 class="h2">Join a party</h2>
        <p class="p">Enter a code to join an existing party</p>
        <h3 class="h3">Add your name to the mix</h3>
        <textarea
          class="textareaname"
          placeholder="What is your name?"
        ></textarea>
        <h3 class="h3">Enter the party code</h3>
        <textarea
          class="textareacode"
          placeholder="Ask the host for the code..."
        ></textarea>

        <button id="Get in the mix ->" class="btn2">Get in the mix ➔</button>

        <div class="popup-overlay" id="popup">
          <div class="box3">
            <button class="close-btn" onclick="closePopup()">✕</button>
            <h2 class="h2">You are almost there</h2>
            <p class="p">Enter your party name</p>
            <textarea
              class="textareaname1"
              placeholder="What is your name?"
            ></textarea>

            <button class="btn1" id="createPartyBtn">Create party ➔</button>
          </div>
          <script src="script-index.js"></script>
        </div>
      </div>
    </div>
  </body>
</html>
